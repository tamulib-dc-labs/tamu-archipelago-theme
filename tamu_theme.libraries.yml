aux-slim:
  version: VERSION
  css:
    base:
      css/slim.css: {}

header-overrides:
  version: VERSION
  css:
    theme:
      css/header.css: { weight: 999 }

cards:
  version: VERSION
  css:
    theme:
      css/cards.css: {}
  js:
    js/card-meta.js: {}
  dependencies:
    - core/drupal
    - core/once

viewer:
  version: VERSION
  css:
    theme:
      css/viewer.css: { weight: 999 }

footer:
  version: VERSION
  css:
    theme:
      css/footer.css: {}

promo-band:
  version: VERSION
  css:
    theme:
      css/promo-band.css: {}

collection-hero:
  version: VERSION
  css:
    theme:
      css/collection-hero.css: { weight: 999 }

collections-list:
  version: VERSION
  css:
    theme:
      css/collections-list.css: { weight: 999 }

search-results:
  version: VERSION
  css:
    theme:
      css/search-results.css: { weight: 999 }
  js:
    js/search-matches.js: {}
    js/media-seek.js: {}
    js/facet-drawer.js: {}
  dependencies:
    - core/drupal
    - core/once
    # facet-drawer.js uses Bootstrap's Offcanvas from the base theme.
    - archipelago_subtheme_chiloe/global-styling

# Item pages: land on the metadata field a search match came from
# (linked from js/search-matches.js).
item-matches:
  version: VERSION
  css:
    theme:
      css/item-matches.css: { weight: 999 }
  js:
    js/match-focus.js: {}
  dependencies:
    - core/drupal
    - core/once
    # match-focus.js shows a hidden metadata tab with Bootstrap's Tab.
    - archipelago_subtheme_chiloe/global-styling

aggie-ux-cdn:
  version: '2.0.0'
  css:
    base:
      'https://aux.tamu.edu/v2/2.0.0/styles/aux-styles.css': { type: external, minified: true }
  js:
    'https://aux.tamu.edu/v2/2.0.0/js/aux.js': { type: external, minified: true }

google-fonts:
  version: VERSION
  css:
    base:
      'https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap': { type: external, minified: true }

# Mobile menu: publishes the top bar height and dismisses the floating panel.
# No weight key here — Drupal rejects positive JS weights outright.
nav:
  js:
    js/nav.js: {}
  dependencies:
    - archipelago_subtheme_chiloe/global-styling
